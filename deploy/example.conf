# Example config for safe_deploy.sh (sourced by bash). All paths are placeholders.
APP_DIR=/srv/myapp
STAGE_DIR=/srv/myapp-stage/2026-11-20
SERVICE=myapp.service                 # leave empty to skip the wait
WAIT_MAX_S=1800                       # give up (changing nothing) if it is still running after this
FILES="worker.py lib/feeds.py config/rules.example.json"
# hash = tr -d '\r' < FILE | sha256sum | cut -c1-12   ("none" = must not exist yet)
EXPECT_OLD="worker.py=0123456789ab lib/feeds.py=ba9876543210 config/rules.example.json=none"
EXPECT_NEW="worker.py=aaaaaaaaaaaa lib/feeds.py=bbbbbbbbbbbb config/rules.example.json=cccccccccccc"
PYTHON=/srv/myapp/venv/bin/python
TEST_CMD="/srv/myapp/venv/bin/python -m unittest discover -s tests -q"
TEST_TIMEOUT_S=600
